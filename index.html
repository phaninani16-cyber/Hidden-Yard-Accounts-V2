 document.querySelectorAll(".pay").forEach(x=>x.oninput=()=>{let s=[...document.querySelectorAll(".pay")].reduce((a,e)=>a+Number(e.value||0),0);pTotal.textContent=money(s);pDiff.textContent=money(v-s)})
}
function saveSales(){
 let date=document.getElementById("saleDate").value,total=Number(document.getElementById("saleTotal").value||0);
 let pays={};document.querySelectorAll(".pay").forEach(e=>pays[e.dataset.mode]=Number(e.value||0));
 let entered=Object.values(pays).reduce((a,b)=>a+b,0);
 if(entered&&Math.abs(entered-total)>0.01&&!confirm("Payment breakup doesn't equal sales. Save anyway?"))return;
 // remove prior manually-entered EOD sale rows for same date, but preserve imported rows
 data.transactions.push({date,type:"Sale",description:"EOD Sales",amount:total,category:"Sales",funding:"Business",party:"",status:"Received",source:"App EOD"});
 renderExpenseEntry(date);
}
function renderExpenseEntry(date){
 appScreen.innerHTML=`<div class="date">Expense entry • ${date}</div><h1>Add expenses</h1><p class="muted">Tap a quick category or enter a custom expense.</p>
 <div class="quick">${["Raw Materials","Milk & Dairy","Vegetables & Fruits","Wages","Gas","Packaging"].map(x=>`<button onclick="customExpense('${x}')">${x}</button>`).join("")}</div>
 <div id="expenseList">${expenseDraftHTML(date)}</div>
 <button class="secondary" onclick="customExpense('Other')">＋ Add Other Expense</button>
 <button class="primary" onclick="closeDay('${date}')">✓ Finish EOD</button>`;
}
function expenseDraftHTML(date){let a=data.transactions.filter(x=>x.date===date&&x.source==="App EOD"&&x.type==="Expense");return a.length?a.map(x=>`<div class="exp"><div><b>${x.category}</b><br><span class="muted">${x.description||""}</span></div><b>${money(x.amount)}</b></div>`).join(""):`<div class="card center muted">No new expenses yet.</div>`}
function customExpense(cat){
 let date=prompt("Date (YYYY-MM-DD):",new Date().toISOString().slice(0,10));if(!date)return;
 let amount=Number(prompt("Amount (₹):",""));if(!amount||amount<0)return;
 let desc=prompt("Description (optional):",cat)||cat;
 let mode=prompt("Payment mode: Cash / UPI / Card / Bank Transfer / Other","Cash")||"Cash";
 data.transactions.push({date,type:"Expense",description:desc,amount,category:cat,funding:mode,party:"",status:"Paid",source:"App EOD"});save();
 renderExpenseEntry(date);
}
function closeDay(date){save();let t=totals(date);appScreen.innerHTML=`<div class="success center"><div style="font-size:38px">✓</div><h1>Day Saved</h1><p class="muted">${date}</p></div><div class="card"><div class="metric"><span>Sales</span><b>${money(t.sales)}</b></div><div class="metric"><span>Expenses</span><b>${money(t.exp)}</b></div><div class="metric"><span>Net</span><b class="green">${money(t.net)}</b></div></div><button class="primary" onclick="home()">Back to Today</button>`}
function pastEntry(){nav("nHome");appScreen.innerHTML=`<h1>Add / Correct Past Day</h1><p class="muted">Use this for historical entries that are missing from the imported workbook.</p><label>Date</label><input id="pastDate" type="date"><button class="primary" onclick="pastStart()">Continue</button>`}
function pastStart(){let d=document.getElementById("pastDate").value;if(!d)return alert("Select a date.");renderSales(d)}
function history(){nav("nHist");let ds=dates().reverse();appScreen.innerHTML=`<h1>History</h1><p class="muted">${ds.length} days with transactions.</p>${ds.map(dayCard).join("")}`}
function viewDay(d){let t=totals(d);appScreen.innerHTML=`<div class="date">${d}</div><h1>${new Date(d+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}</h1><div class="grid"><div class="card"><div class="muted">Sales</div><div class="big">${money(t.sales)}</div></div><div class="card"><div class="muted">Expenses</div><div class="big">${money(t.exp)}</div></div></div><div class="card"><div class="metric"><span>Net</span><b class="${t.net>=0?'green':'red'}">${money(t.net)}</b></div></div><h2>Transactions</h2>${t.rows.map(x=>`<div class="exp"><div><b>${x.type==="Sale"?"💰 ":""}${esc(x.description)}</b><br><span class="pill">${esc(x.category)}</span> <span class="pill">${esc(x.funding)}</span></div><div class="right"><b>${money(x.amount)}</b><br><span class="muted">${esc(x.status)}</span></div></div>`).join("")}<button class="secondary" onclick="history()">Back</button>`}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
home();
</script></body></html>
