function load(){try{const raw=localStorage.getItem(KEY);if(raw)return JSON.parse(raw)}catch(e){} const s=seed();try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){} return s}
let db=load(); function save(x=db){db=x;localStorage.setItem(KEY,JSON.stringify(db))}
function sales(){return (db.transactions||[]).filter(t=>t.type==='Sale')}
function salesTotal(){return sales().reduce((a,t)=>a+t.amount,0)}
function txFor(date){return (db.transactions||[]).filter(t=>t.date===date).sort((a,b)=>(a.created||'').localeCompare(b.created||''))}
function daySales(date){return txFor(date).filter(t=>t.type==='Sale').reduce((a,t)=>a+t.amount,0)}
function dayWages(date){return db.wages.filter(x=>x.date===date&&x.status!=='Pending').reduce((a,x)=>a+x.amount,0)+txFor(date).filter(x=>x.type==='Wage'&&x.status!=='Pending').reduce((a,x)=>a+x.amount,0)}
function dayExpenses(date){return txFor(date).filter(t=>t.type==='Expense'&&t.status!=='Pending').reduce((a,t)=>a+t.amount,0)+dayWages(date)}
function dayCashSales(date){return txFor(date).filter(t=>t.type==='Sale'&&t.category==='Sales through Physical Cash').reduce((a,t)=>a+t.amount,0)}
function dayUPI(date){return txFor(date).filter(t=>t.type==='Sale'&&t.category==='Sales through UPI').reduce((a,t)=>a+t.amount,0)}

function openEOD(date=todayISO()){const d=date;const cash=dayCashSales(d),upi=dayUPI(d),w=db.wages.filter(x=>x.date===d).reduce((a,x)=>a+x.amount,0)+txFor(d).filter(x=>x.type==='Wage').reduce((a,x)=>a+x.amount,0);const cashExp=txFor(d).filter(x=>['Expense','Wage'].includes(x.type)&&x.funding==='Business Cash'&&x.status!=='Pending').reduce((a,x)=>a+x.amount,0);document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="eod" data-date="${d}"><div class="sheet"><div class="handle"></div><div class="row"><b>Close ${fmtDate(d)}</b><button class="btn small secondary" onclick="document.getElementById('eod').remove()">Close</button></div><div class="kpi" style="margin-top:14px"><div class="k"><div class="muted">Physical Cash</div><b>${fmt(cash)}</b></div><div class="k"><div class="muted">UPI</div><b>${fmt(upi)}</b></div><div class="k"><div class="muted">Total Sales</div><b>${fmt(cash+upi)}</b></div><div class="k"><div class="muted">Cash expenses + wages</div><b>${fmt(cashExp)}</b></div></div><div class="card" style="margin-top:12px"><div class="muted">Opening cash</div><input id="openCash" type="number" inputmode="decimal" placeholder="Enter opening cash" style="margin-top:7px;width:100%;padding:13px;border:1px solid var(--line);border-radius:13px"><div class="muted" style="margin-top:10px">Expected closing cash = Opening + physical cash sales − cash expenses/wages</div><div class="metric" id="expected">—</div><div class="field" style="margin-top:10px"><label>Actual cash counted</label><input id="actualCash" type="number" inputmode="decimal" oninput="calcEOD()"></div><div class="metric" id="diff">Difference —</div></div><button class="btn" onclick="closeDay('${d}')">Confirm & Close Day</button></div></div>`)}
function calcEOD(){const day=document.getElementById('eod');if(!day)return;const open=Number(document.getElementById('openCash').value||0);const date=day.dataset.date||todayISO();const ex=txFor(date).filter(x=>x.type==='Expense'&&x.funding==='Business Cash'&&x.status!=='Pending').reduce((a,x)=>a+x.amount,0)+db.wages.filter(x=>x.date===date&&x.paidFrom==='Business Cash'&&x.status!=='Pending').reduce((a,x)=>a+x.amount,0)+txFor(date).filter(x=>x.type==='Wage'&&x.funding==='Business Cash'&&x.status!=='Pending').reduce((a,x)=>a+x.amount,0);const expected=open+dayCashSales(date)-ex;document.getElementById('expected').textContent=fmt(expected);const actual=Number(document.getElementById('actualCash').value||0);document.getElementById('diff').textContent='Difference '+fmt(actual-expected)}
function closeDay(d){const open=Number(document.getElementById('openCash').value||0),actual=Number(document.getElementById('actualCash').value||0);const ex=txFor(d).filter(x=>x.type==='Expense'&&x.funding==='Business Cash'&&x.status!=='Pending').reduce((a,x)=>a+x.amount,0)+db.wages.filter(x=>x.date===d&&x.paidFrom==='Business Cash'&&x.status!=='Pending').reduce((a,x)=>a+x.amount,0)+txFor(d).filter(x=>x.type==='Wage'&&x.funding==='Business Cash'&&x.status!=='Pending').reduce((a,x)=>a+x.amount,0);const expected=open+dayCashSales(d)-ex;db.closed[d]={date:d,opening:open,expected,actual,difference:actual-expected,closedAt:new Date().toISOString()};save();document.getElementById('eod').remove();go(page)}

function inventory(){return `<div class="row"><div><div class="section-title" style="margin-top:0">Inventory</div><div class="muted">Stock from workbook + live adjustments</div></div><button class="btn small" onclick="openInv()">+ Stock</button></div><div class="list">${db.inventory.map(i=>{const close=i.opening+i.purchases-i.used;const low=i.reorder>0&&close<=i.reorder;return `<div class="item"><div class="row"><div><div class="item-title">${esc(i.item)}</div><div class="item-sub">${esc(i.category)} · ${esc(i.unit)} · Avg ${fmt(i.cost)}</div></div><div style="text-align:right"><div class="amount">${close}</div><div class="pill ${low?'danger-text':''}">${low?'REORDER':'In stock'}</div></div></div></div>`}).join('')}</div>`}
function openInv(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="invmodal"><div class="sheet"><div class="handle"></div><div class="row"><b>Inventory adjustment</b><button class="btn small secondary" onclick="document.getElementById('invmodal').remove()">Close</button></div><div class="form" style="margin-top:14px"><div class="field"><label>Item</label><select id="ii">${db.inventory.map(i=>`<option value="${esc(i.id)}">${esc(i.item)}</option>`).join('')}</select></div><div class="field"><label>Purchase quantity</label><input id="iq" type="number" step="0.01"></div><div class="field"><label>Average cost per unit</label><input id="ic" type="number" step="0.01"></div><div class="field"><label>Used / sold quantity</label><input id="iu" type="number" step="0.01"></div><button class="btn" onclick="saveInv()">Save Stock</button></div></div></div>`)}

function products(){return `<div class="row"><div><div class="section-title" style="margin-top:0">Products & Margins</div><div class="muted">Review cost completeness and margin</div></div></div><div class="list">${db.products.map(p=>{const cost=p.ingredient+p.packaging+p.other,profit=p.price-cost,margin=p.price?profit/p.price:0;return `<div class="item" onclick="editProduct('${p.id}')"><div class="row"><div><div class="item-title">${esc(p.product)}</div><div class="item-sub">${esc(p.category)} · Cost ${fmt(cost)}</div></div><div style="text-align:right"><div class="amount">${fmt(profit)}</div><div class="pill ${cost===0?'danger-text':''}">${cost===0?'ENTER COST':Math.round(margin*100)+'% margin'}</div></div></div></div>`}).join('')}</div>`}
function editProduct(id){const p=db.products.find(x=>x.id===id);document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="pm"><div class="sheet"><div class="handle"></div><div class="row"><b>${esc(p.product)}</b><button class="btn small secondary" onclick="document.getElementById('pm').remove()">Close</button></div><div class="form" style="margin-top:14px"><div class="field"><label>Selling price</label><input id="pp" type="number" value="${p.price}"></div><div class="field"><label>Ingredient cost</label><input id="pi" type="number" value="${p.ingredient}"></div><div class="field"><label>Packaging cost</label><input id="pk" type="number" value="${p.packaging}"></div><div class="field"><label>Other direct cost</label><input id="po" type="number" value="${p.other}"></div><button class="btn" onclick="saveProduct('${id}')">Save Product</button></div></div></div>`)}
function saveProduct(id){const p=db.products.find(x=>x.id===id);p.price=+document.getElementById('pp').value;p.ingredient=+document.getElementById('pi').value;p.packaging=+document.getElementById('pk').value;p.other=+document.getElementById('po').value;save();document.getElementById('pm').remove();go('products')}
function reports(){const byCat={};(db.transactions||[]).filter(t=>t.type==='Expense'||t.type==='Wage').forEach(t=>byCat[t.category||t.type]=(byCat[t.category||t.type]||0)+t.amount);const months={};(db.transactions||[]).filter(t=>t.type==='Sale').forEach(t=>{const m=t.date.slice(0,7);months[m]=(months[m]||0)+t.amount});return `<div class="section-title" style="margin-top:0">Reports</div><div class="actions"><button class="btn" onclick="exportExcel()">Export Excel</button><button class="btn secondary" onclick="exportData()">Backup JSON</button></div><div class="card"><div class="muted">All-time sales</div><div class="metric">${fmt(salesTotal())}</div><div class="muted" style="margin-top:5px">Physical cash ${fmt(sales().filter(t=>t.category==='Sales through Physical Cash').reduce((a,t)=>a+t.amount,0))} · UPI ${fmt(sales().filter(t=>t.category==='Sales through UPI').reduce((a,t)=>a+t.amount,0))}</div></div><div class="section-title">Monthly sales</div><div class="list">${Object.entries(months).sort().reverse().map(([m,v])=>`<div class="item"><div class="row"><b>${m}</b><b>${fmt(v)}</b></div></div>`).join('')}</div><div class="section-title">Expense categories</div><div class="list">${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="item"><div class="row"><span>${esc(k)}</span><b>${fmt(v)}</b></div></div>`).join('')}</div>`}

function xesc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function xlsxCol(n){let s='';while(n){let r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s}
function sheetXml(rows){let max=0;rows.forEach(r=>max=Math.max(max,r.length));let body='';rows.forEach((r,ri)=>{body+='<row r="'+(ri+1)+'">';r.forEach((v,ci)=>{const ref=xlsxCol(ci+1)+(ri+1);if(typeof v==='number'&&Number.isFinite(v)){body+='<c r="'+ref+'"><v>'+v+'</v></c>'}else{body+='<c r="'+ref+'" t="inlineStr"><is><t>'+xesc(v)+'</t></is></c>'}});body+='</row>'});return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+body+'</sheetData></worksheet>'}
function crc32(bytes){let table=crc32.table;if(!table){table=crc32.table=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);table[n]=c>>>0}}let c=0xFFFFFFFF;for(const b of bytes)c=table[(c^b)&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
function cat(...arrs){let len=arrs.reduce((a,b)=>a+b.length,0),o=new Uint8Array(len),p=0;for(const a of arrs){o.set(a,p);p+=a.length}return o}
function zipStore(files){const enc=new TextEncoder(),local=[],central=[];let offset=0;for(const f of files){const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);const lh=cat(new Uint8Array([80,75,3,4]),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data);local.push(lh);const ch=cat(new Uint8Array([80,75,1,2]),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name);central.push(ch);offset+=lh.length}const cent=cat(...central),loc=cat(...local),end=cat(new Uint8Array([80,75,5,6]),u16(0),u16(0),u16(files.length),u16(files.length),u32(cent.length),u32(loc.length),u16(0));return cat(loc,cent,end)}
function exportExcel(){try{const tx=[['Date','Type','Description','Amount','Category','Funding','Party / Supplier','Status']];(db.transactions||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(t=>tx.push([t.date,t.type,t.description,t.amount,t.category,t.funding,t.party||'',t.status]));const dailyMap={};(db.transactions||[]).forEach(t=>{const d=t.date;if(!dailyMap[d])dailyMap[d]={cash:0,upi:0,expense:0,wage:0,owner:0,pending:0};if(t.type==='Sale'){if(t.category==='Sales through Physical Cash')dailyMap[d].cash+=t.amount;if(t.category==='Sales through UPI')dailyMap[d].upi+=t.amount}else if(t.status==='Pending'){dailyMap[d].pending+=t.amount}else if(t.type==='Wage'||t.category==='Wages'){dailyMap[d].wage+=t.amount}else if(t.funding==='Owner funded'||t.funding==='Owner Paid'){dailyMap[d].owner+=t.amount}else if(t.type==='Expense'){dailyMap[d].expense+=t.amount}});const daily=[['Date','Physical Cash Sales','UPI Sales','Total Sales','Expenses','Wages','Owner Funded / Paid','Pending']];Object.keys(dailyMap).sort().forEach(d=>{const x=dailyMap[d];daily.push([d,x.cash,x.upi,x.cash+x.upi,x.expense,x.wage,x.owner,x.pending])});const salesRows=[['Date','Sales Channel','Amount','Funding','Status']];sales().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>salesRows.push([t.date,t.category,t.amount,t.funding,t.status]));const expRows=[['Date','Description','Amount','Category','Funding','Party / Supplier','Status']];(db.transactions||[]).filter(t=>t.type==='Expense'||t.type==='Wage').sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>expRows.push([t.date,t.description,t.amount,t.category||t.type,t.funding,t.party||'',t.status]));const wageRows=[['Date','Employee','Amount','Paid From','Status']];(db.wages||[]).forEach(w=>wageRows.push([w.date,w.employee,w.amount,w.paidFrom,w.status]));(db.transactions||[]).filter(t=>t.type==='Wage').forEach(t=>wageRows.push([t.date,t.party||'',t.amount,t.funding,t.status]));const ownerRows=[['Date','Description','Amount','Purpose','Status']];(db.owner||[]).forEach(o=>ownerRows.push([o.date,o.description,o.amount,o.purpose,o.status]));(db.transactions||[]).filter(t=>t.type==='Owner Funding'||t.funding==='Owner funded'||t.funding==='Owner Paid').forEach(t=>ownerRows.push([t.date,t.description,t.amount,t.category||'',t.status]));const invRows=[['Item','Category','Unit','Opening Qty','Purchases Qty','Used / Sold Qty','Closing Qty','Avg Cost / Unit','Reorder Level','Status']];(db.inventory||[]).forEach(i=>invRows.push([i.item,i.category,i.unit,i.opening,i.purchases,i.used,i.opening+i.purchases-i.used,i.cost,i.reorder,i.status]));const prodRows=[['Product','Category','Selling Price','Ingredient Cost','Packaging Cost','Other Direct Cost','Total Cost','Gross Profit','Margin %','Target Margin %']];(db.products||[]).forEach(p=>{const c=p.ingredient+p.packaging+p.other,g=p.price-c,m=p.price?g/p.price:0;prodRows.push([p.product,p.category,p.price,p.ingredient,p.packaging,p.other,c,g,m,p.target])});const recRows=[['Date','Type','Description','Amount','Party','Funding','Status']];(db.transactions||[]).filter(t=>t.type==='Receivable'||t.type==='Receivable Recovery').forEach(t=>recRows.push([t.date,t.type,t.description,t.amount,t.party||'',t.funding,t.status]));const eodRows=[['Date','Opening Cash','Cash Sales','Cash Expenses','Wages','Expected Closing','Actual Cash','Difference','Closed']];(db.eod||[]).forEach(e=>eodRows.push([e.date,e.opening||0,e.cashSales||0,e.cashExpenses||0,e.wages||0,e.expected||0,e.actual||0,(e.actual||0)-(e.expected||0),e.closed?'Yes':'No']));const sheets=[['Transactions',tx],['Daily Summary',daily],['Sales',salesRows],['Expenses',expRows],['Wages',wageRows],['Owner Funding',ownerRows],['Inventory',invRows],['Product Margins',prodRows],['Receivables',recRows],['EOD',eodRows]];const files=[];const rels=[];sheets.forEach((s,i)=>{files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',data:sheetXml(s[1])});rels.push('<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>')});const workbook='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((s,i)=>'<sheet name="'+xesc(s[0]).slice(0,31)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>';const workbookRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels.join('')+'</Relationships>';const rootRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';const types='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>';files.push({name:'[Content_Types].xml',data:types},{name:'_rels/.rels',data:rootRels},{name:'xl/workbook.xml',data:workbook},{name:'xl/_rels/workbook.xml.rels',data:workbookRels});const blob=new Blob([zipStore(files)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Hidden_Yard_Accounts_'+toda function wages(){const map={};db.wages.forEach(w=>map[w.employee]=(map[w.employee]||0)+w.amount);(db.transactions||[]).filter(t=>t.type==='Wage').forEach(t=>map[t.party||'Unassigned']=(map[t.party||'Unassigned']||0)+t.amount);return `<div class="section-title" style="margin-top:0">Wages</div><div class="actions"><button class="btn" onclick="openAdd('Wage')">+ Add Wage</button><button class="btn secondary" onclick="go('history')">View ledger</button></div><div class="list" style="margin-top:12px">${Object.entries(map).map(([k,v])=>`<div class="item"><div class="row"><span>${esc(k)}</span><b>${fmt(v)}</b></div></div>`).join('')}</div>`}

function receivables(){const open=(db.transactions||[]).filter(t=>t.type==='Receivable'&&t.status==='Outstanding');const total=open.reduce((a,t)=>a+t.amount,0);return `<div class="section-title" style="margin-top:0">Receivables</div><div class="card"><div class="muted">Outstanding</div><div class="metric">${fmt(total)}</div></div><div class="actions"><button class="btn" onclick="openAdd('Receivable')">+ Receivable</button><button class="btn secondary" onclick="openRecovery()">+ Recovery</button></div><div class="list" style="margin-top:12px">${open.map(t=>`<div class="item"><div class="row"><div><b>${esc(t.party||'Person')}</b><div class="item-sub">${esc(t.description)} · ${fmt(t.amount)}</div></div><button class="btn small secondary" onclick="recover('${t.id}')">Recover</button></div></div>`).join('')||'<div class="empty">No outstanding receivables.</div>'}</div>`}
function openRecovery(){const open=(db.transactions||[]).filter(t=>t.type==='Receivable'&&t.status==='Outstanding');document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="rm"><div class="sheet"><div class="handle"></div><div class="row"><b>Receivable recovery</b><button class="btn small secondary" onclick="document.getElementById('rm').remove()">Close</button></div><div class="form" style="margin-top:14px"><div class="field"><label>Receivable</label><select id="rr">${open.map(t=>`<option value="${t.id}">${esc(t.party||'Person')} — ${fmt(t.amount)}</option>`).join('')}</select></div><div class="field"><label>Amount recovered</label><input id="ra" type="number"></div><div class="field"><label>Received through</label><select id="rf"><option>Business Cash</option><option>Business Bank/UPI</option></select></div><button class="btn" onclick="saveRecovery()">Save Recovery</button></div></div></div>`)}
function saveRecovery(){const src=db.transactions.find(t=>t.id===document.getElementById('rr').value);const amt=Number(document.getElementById('ra').value||0);if(!src||!amt)return;src.status=amt>=src.amount?'Recovered':'Partially Recovered';db.transactions.push({id:uid(),date:todayISO(),type:'Receivable Recovery',description:'Recovery from '+(src.party||'receivable'),amount:amt,category:'Receivable Recovery',funding:document.getElementById('rf').value,party:src.party||'',status:'Received',created:new Date().toISOString()});save();document.getElementById('rm').remove();go('receivables')}
function recover(id){const t=db.transactions.find(x=>x.id===id);if(t){t.status='Recovered';db.transactions.push({id:uid(),date:todayISO(),type:'Receivable Recovery',description:'Recovery from '+(t.party||'receivable'),amount:t.amount,category:'Receivable Recovery',funding:'Business Cash',party:t.party||'',status:'Received',created:new Date().toISOString()});save();go('receivables')}}
function ownerReport(){const arr=(db.transactions||[]).filter(t=>t.type==='Owner Funding'||t.funding==='Owner funded'||t.funding==='Owner Paid');const total=arr.reduce((a,t)=>a+t.amount,0);return `<div class="section-title" style="margin-top:0">Owner Funding</div><div class="card"><div class="muted">Total owner-funded / owner-paid</div><div class="metric">${fmt(total)}</div></div><div class="list">${arr.sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="item"><div class="row"><div><b>${esc(t.description)}</b><div class="item-sub">${fmtDate(t.date)} · ${esc(t.category||t.type)}</div></div><b>${fmt(t.amount)}</b></div></div>`).join('')}</div>`}
function backup(){return `<div class="section-title" style="margin-top:0">Backup & Restore</div><div class="card"><b>Local-only storage</b><div class="muted" style="margin-top:5px">Your accounts are stored in this browser/device. Export a backup regularly.</div></div><div class="actions"><button class="btn" onclick="exportData()">Export Backup</button><button class="btn secondary" onclick="document.getElementById('restore').click()">Restore Backup</button></div><input id="restore" type="file" accept="application/json" style="display:none" onchange="restoreData(event)"><div class="notice" style="margin-top:12px">This backup includes transactions, wages, owner funding, inventory, products, stock checks and EOD closures.</div>`}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Hidden_Yard_Accounts_Backup_'+todayISO()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.transactions)throw Error('Invalid backup');if(confirm('Replace current local data with this backup?')){db=x;save();go('home')}}catch(err){alert('Invalid backup file.')}};r.readAsText(f)}
function boot(){renderFields();go('home');if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}
boot();
</script></body></html>
