const today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function nav(id){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));document.getElementById(id).classList.add("active")}
function dayRows(date){return data.transactions.filter(x=>x.date===date)}
function totals(date){let a=dayRows(date),sales=a.filter(x=>x.type==="Sale").reduce((s,x)=>s+Number(x.amount||0),0),exp=a.filter(x=>x.type==="Expense").reduce((s,x)=>s+Number(x.amount||0),0);return {sales,exp,net:sales-exp,rows:a}}
function dates(){return [...new Set(data.transactions.map(x=>x.date))].sort()}
function fmt(d,opts={day:"2-digit",month:"short",year:"numeric"}){return new Date(d+"T00:00:00").toLocaleDateString("en-IN",opts)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function uid(){return "t_"+Date.now()+"_"+Math.random().toString(36).slice(2,8)}
function ensureIds(){let changed=false;data.transactions.forEach(x=>{if(!x.id){x.id=uid();changed=true}});if(changed)save()}
ensureIds();
function home(){
 nav("nHome");let d=today(),t=totals(d),all=data.transactions;
 let sales=all.filter(x=>x.type==="Sale").reduce((s,x)=>s+Number(x.amount||0),0),exp=all.filter(x=>x.type==="Expense").reduce((s,x)=>s+Number(x.amount||0),0);
 appScreen.innerHTML=`<div class="eyebrow">TODAY • ${fmt(d,{weekday:"short",day:"2-digit",month:"short"})}</div>
 <div class="hero"><div><h1>Daily Accounts</h1><p>Record anything during the day. Close when you're ready.</p></div><div class="heroIcon">HY</div></div>
 <div class="grid"><div class="stat"><span>Sales today</span><b>${money(t.sales)}</b></div><div class="stat"><span>Expenses today</span><b>${money(t.exp)}</b></div></div>
 <div class="card"><div class="metric"><span>Net today</span><b class="${t.net>=0?'green':'red'}">${money(t.net)}</b></div><div class="metric"><span>Historical sales</span><b>${money(sales)}</b></div><div class="metric"><span>Historical expenses</span><b>${money(exp)}</b></div></div>
 <button class="primary" onclick="addTransaction('${d}')">＋ Add Transaction</button>
 <button class="secondary" onclick="closeReview('${d}')">✓ Close Today / EOD</button>
 <h2>Today's Activity</h2>${activityHTML(d)}
 <h2>Recent Days</h2>${dates().slice(-5).reverse().map(dayCard).join("")}`;
}
function activityHTML(d){let rows=dayRows(d).slice().reverse();return rows.length?rows.slice(0,12).map(transactionRow).join(""):`<div class="empty">No transactions recorded today.<br><span>Sales, expenses and other entries can be added anytime.</span></div>`}
function dayCard(d){let t=totals(d);return `<button class="dayRow" onclick="viewDay('${d}')"><span><b>${fmt(d)}</b><small>${t.rows.length} transaction${t.rows.length===1?'':'s'}</small></span><span class="right"><b>${money(t.sales)}</b><small class="${t.net>=0?'green':'red'}">Net ${money(t.net)}</small></span></button>`}
function transactionRow(x){return `<div class="tx"><div class="txMain"><div class="txTitle"><span class="dot ${x.type==='Sale'?'sale':'expense'}"></span>${esc(x.description||x.category||x.type)}</div><div class="txMeta">${esc(x.category||x.type)} · ${esc(x.funding||'')}</div></div><div class="txAmt ${x.type==='Expense'?'expenseAmt':''}">${x.type==='Expense'?'−':'+'}${money(x.amount)}</div><button class="iconBtn" onclick="editTransaction('${x.id}')" aria-label="Edit">⋯</button></div>`}
function newDay(){addTransaction(today())}
function addTransaction(date=today()){nav("nNew");transactionForm(null,date)}
function transactionForm(id,date){
 let x=id?data.transactions.find(a=>a.id===id):null;
 appScreen.innerHTML=`<div class="eyebrow">${x?'EDIT TRANSACTION':'NEW TRANSACTION'}</div><h1>${x?'Edit transaction':'Add transaction'}</h1><p class="muted">Record sales or expenses whenever they happen. No need to wait for EOD.</p>
 <label>Date</label><input id="txDate" type="date" value="${esc(x?.date||date)}">
 <label>Type</label><div class="seg"><button id="typeSale" class="${(!x||x.type==='Sale')?'sel':''}" onclick="setType('Sale')">Sale</button><button id="typeExp" class="${x?.type==='Expense'?'sel':''}" onclick="setType('Expense')">Expense</button></div>
 <input id="txType" type="hidden" value="${esc(x?.type||'Sale')}">
 <label>Description</label><input id="txDesc" value="${esc(x?.description||'')}" placeholder="e.g. Cash Sales, Groceries, Power bill">
 <label>Amount</label><input id="txAmount" type="number" inputmode="decimal" min="0" value="${x?Number(x.amount):''}" placeholder="₹ 0">
 <label>Category</label><select id="txCat">${cats.map(c=>`<option ${x?.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
 <label>Paid / received through</label><select id="txFunding">${fundings.map(c=>`<option ${x?.funding===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
 <label>Employee / Supplier <span class="optional">optional</span></label><input id="txParty" value="${esc(x?.party||x?.['Employee/Supplier']||'')}" placeholder="Optional">
 <div class="formActions"><button class="primary" onclick="saveTransaction(${id?`'${id}'`:'null'})">${x?'Save Changes':'Save Transaction'}</button>${x?`<button class="danger" onclick="deleteTransaction('${id}')">Delete Transaction</button>`:''}<button class="secondary" onclick="${x?`viewDay('${x.date}')`:`home()`}">Cancel</button></div>`;
}
function setType(type){txType.value=type;typeSale.classList.toggle('sel',type==='Sale');typeExp.classList.toggle('sel',type==='Expense');if(type==='Sale'){txCat.value='Sales';txFunding.value='Business Cash'}else if(txCat.value==='Sales')txCat.value='Raw Materials'}
function saveTransaction(id){let date=txDate.value,type=txType.value,desc=txDesc.value.trim(),amount=Number(txAmount.value||0),category=txCat.value,funding=txFunding.value,party=txParty.value.trim();if(!date||!amount||amount<0)return alert('Enter a date and valid amount.');if(!desc)return alert('Enter a description.');if(type==='Sale'){category='Sales';if(!['Business Cash','Business Bank/UPI'].includes(funding))funding='Business Cash'}let obj={date,type,description:desc,amount,category,funding,party,status:type==='Sale'?'Received':(funding==='Pending Supplier'?'Pending':'Paid'),source:id?(data.transactions.find(x=>x.id===id)?.source||'App'): 'App'};if(id){let i=data.transactions.findIndex(x=>x.id===id);if(i>=0){obj.id=id;data.transactions[i]=obj}}else{obj.id=uid();data.transactions.push(obj)}save();viewDay(date)}
function editTransaction(id){let x=data.transactions.find(a=>a.id===id);if(x)transactionForm(id,x.date)}
function deleteTransaction(id){let x=data.transactions.find(a=>a.id===id);if(!x)return;if(!confirm(`Delete ${x.description} — ${money(x.amount)}?`))return;let d=x.date;data.transactions=data.transactions.filter(a=>a.id!==id);save();viewDay(d)}
function closeReview(d){let t=totals(d),cashSales=dayRows(d).filter(x=>x.type==='Sale'&&x.funding==='Business Cash').reduce((s,x)=>s+Number(x.amount||0),0),cashExp=dayRows(d).filter(x=>x.type==='Expense'&&x.funding==='Business Cash').reduce((s,x)=>s+Number(x.amount||0),0);appScreen.innerHTML=`<div class="eyebrow">EOD REVIEW</div><h1>Close ${fmt(d,{day:'2-digit',month:'short'})}</h1><p class="muted">Review today's entries. You can still edit anything before closing.</p><div class="grid"><div class="stat"><span>Sales</span><b>${money(t.sales)}</b></div><div class="stat"><span>Expenses</span><b>${money(t.exp)}</b></div></div><div class="card"><div class="metric"><span>Cash sales</span><b>${money(cashSales)}</b></div><div class="metric"><span>Cash expenses</span><b>${money(cashExp)}</b></div><div class="metric"><span>Net</span><b class="${t.net>=0?'green':'red'}">${money(t.net)}</b></div></div><div class="note">Expected cash movement today: <b>${money(cashSales-cashExp)}</b><br><span>Opening cash and actual cash count can be added in a later cash-control step.</span></div><button class="primary" onclick="closeDay('${d}')">✓ Confirm & Close Day</button><button class="secondary" onclick="viewDay('${d}')">Review Transactions</button>`}
function closeDay(d){save();let t=totals(d);appScreen.innerHTML=`<div class="success center"><div class="check">✓</div><h1>Day Closed</h1><p class="muted">${fmt(d,{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</p></div><div class="card"><div class="metric"><span>Sales</span><b>${money(t.sales)}</b></div><div class="metric"><span>Expenses</span><b>${money(t.exp)}</b></div><div class="metric"><span>Net</span><b class="${t.net>=0?'green':'red'}">${money(t.net)}</b></div></div><button class="primary" onclick="home()">Back to Today</button>`}
function pastEntry(){nav('nHome');appScreen.innerHTML=`<div class="eyebrow">HISTORY</div><h1>Add / Correct Past Day</h1><p class="muted">Choose a date, then add, edit or delete individual transactions.</p><label>Date</label><input id="pastDate" type="date" value="${today()}"><button class="primary" onclick="pastStart()">Open Day</button><button class="secondary" onclick="history()">View History</button>`}
function pastStart(){let d=pastDate.value;if(!d)return alert('Select a date.');viewDay(d)}
function history(){nav('nHist');let ds=dates().reverse();appScreen.innerHTML=`<div class="eyebrow">LEDGER</div><h1>History</h1><p class="muted">${ds.length} dates with transactions.</p><button class="secondary" onclick="pastEntry()">＋ Add / Correct Past Day</button>${ds.map(dayCard).join('')}`}
function viewDay(d){let t=totals(d);appScreen.innerHTML=`<div class="eyebrow">${fmt(d,{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}</div><div class="hero"><div><h1>${fmt(d,{weekday:'long',day:'2-digit',month:'long'})}</h1><p>Tap any transaction to edit or delete it.</p></div></div><div class="grid"><div class="stat"><span>Sales</span><b>${money(t.sales)}</b></div><div class="stat"><span>Expenses</span><b>${money(t.exp)}</b></div></div><div class="card"><div class="metric"><span>Net</span><b class="${t.net>=0?'green':'red'}">${money(t.net)}</b></div><div class="metric"><span>Transactions</span><b>${t.rows.length}</b></div></div><button class="primary" onclick="addTransaction('${d}')">＋ Add Transaction</button><h2>Transactions</h2>${t.rows.length?t.rows.map(transactionRow).join(''):`<div class="empty">No transactions for this date.</div>`}<button class="secondary" onclick="history()">Back to History</button>`}
home();
</script></body></html>
